name: CI/CD para EC2 pública

on:
  push:
    branches:
      - main

jobs:
  build_FE:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (lucaspaessptech/toomate:frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: lucaspaessptech/toomate:frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Recriar frontend na instância pública
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull lucaspaessptech/toomate:frontend
            docker stop frontend || true
            docker rm frontend || true
            docker network create toomate_network || true
            docker run --network toomate_network --env-file /etc/toomate/containers.env --name frontend -p 80:80 -d lucaspaessptech/toomate:frontend